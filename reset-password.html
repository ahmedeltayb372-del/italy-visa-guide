<script>
(async function(){
  var r = await supabaseClient.from("guide_settings").select("key,value_ar,value_en").in("key",["site_banner_enabled","site_banner_message","site_launch_date"]);
  if(r.error||!r.data) return;
  var by={}; r.data.forEach(function(x){by[x.key]=x});
  var en = by.site_banner_enabled && (by.site_banner_enabled.value_ar==="true" || by.site_banner_enabled.value_en==="true");
  if(!en) return;
  var isEn = document.documentElement.lang==="en";
  var m = by.site_banner_message ? (isEn ? (by.site_banner_message.value_en||by.site_banner_message.value_ar) : (by.site_banner_message.value_ar||by.site_banner_message.value_en)) : (isEn?"We are rolling out some updates.":"الموقع في شوية تحديثات.");
  var d = by.site_launch_date ? (by.site_launch_date.value_ar||by.site_launch_date.value_en) : "";
  if(d) m += isEn ? (" Expected launch: "+d) : (" — الافتتاح المتوقع: "+d);
  var el = document.getElementById("siteUpdateBanner");
  el.textContent = "🚧 " + m;
  el.style.display = "block";
})();
</script>

<div id="formState" style="display:none">

<form id="form">
<div class="field"><label id="passLabel">كلمة المرور الجديدة</label><input id="password" type="password" required minlength="6"></div>
<div class="field"><label id="pass2Label">تأكيد كلمة المرور</label><input id="password2" type="password" required minlength="6"></div>
<div class="row" style="justify-content:flex-end"><button class="btn primary" id="submit">حفظ كلمة المرور</button></div>
</form>

<div class="links"><a href="login.html" id="backLogin">العودة لتسجيل الدخول</a></div>
</div>

</section></main>
<script>
let en=false;
const T={
ar:{title:"إعادة تعيين كلمة المرور",sub:"اكتب كلمة مرور جديدة لحسابك.",pass:"كلمة المرور الجديدة",pass2:"تأكيد كلمة المرور",submit:"حفظ كلمة المرور",switch:"English",
checking:"جاري التحقق من الرابط...",mismatch:"كلمتا المرور غير متطابقتين.",short:"كلمة المرور لازم تكون 6 حروف على الأقل.",
saved:"تم تغيير كلمة المرور بنجاح، جاري تحويلك لتسجيل الدخول...",
invalidTitle:"الرابط غير صالح",invalidText:"رابط إعادة تعيين كلمة المرور غير صالح أو منتهي الصلاحية. جرّب تطلب رابط جديد.",backLogin:"العودة لتسجيل الدخول"},
en:{title:"Reset your password",sub:"Enter a new password for your account.",pass:"New password",pass2:"Confirm password",submit:"Save password",switch:"العربية",
checking:"Verifying link...",mismatch:"Passwords do not match.",short:"Password must be at least 6 characters.",
saved:"Password updated successfully, redirecting to login...",
invalidTitle:"Invalid link",invalidText:"This password reset link is invalid or has expired. Please request a new one.",backLogin:"Back to login"}
};
function tr(){
const t=T[en?"en":"ar"];
document.documentElement.lang=en?"en":"ar";document.documentElement.dir=en?"ltr":"rtl";
document.getElementById("title").textContent=t.title;
document.getElementById("sub").textContent=t.sub;
document.getElementById("passLabel").textContent=t.pass;
document.getElementById("pass2Label").textContent=t.pass2;
document.getElementById("submit").textContent=t.submit;
document.getElementById("lang").textContent=t.switch;
document.getElementById("loadingState").textContent=t.checking;
document.getElementById("invalidTitle").textContent=t.invalidTitle;
document.getElementById("invalidText").textContent=t.invalidText;
document.getElementById("backLogin").textContent=t.backLogin;
}
document.getElementById("lang").onclick=()=>{en=!en;tr()};tr();

function show(x,id){const a=document.getElementById(id);a.textContent=x;a.style.display="block"}
function hideMsgs(){document.querySelectorAll(".msg").forEach(x=>x.style.display="none")}

let recoveryReady=false;

function showForm(){
if(recoveryReady)return;
recoveryReady=true;
document.getElementById("loadingState").style.display="none";
document.getElementById("invalidState").style.display="none";
document.getElementById("formState").style.display="block";
}

function showInvalid(){
if(recoveryReady)return;
document.getElementById("loadingState").style.display="none";
document.getElementById("formState").style.display="none";
document.getElementById("invalidState").style.display="block";
}

supabaseClient.auth.onAuthStateChange((event, session)=>{
if(event==="PASSWORD_RECOVERY" && session){ showForm(); }
});

(async ()=>{
const {data:{session}} = await supabaseClient.auth.getSession();
if(session){ showForm(); return; }
setTimeout(()=>{ if(!recoveryReady) showInvalid(); }, 2500);
})();

document.getElementById("form").onsubmit=async e=>{
e.preventDefault();hideMsgs();
const t=T[en?"en":"ar"];
const p1=password.value, p2=password2.value;
if(p1.length<6)return show(t.short,"err");
if(p1!==p2)return show(t.mismatch,"err");
const submitBtn=document.getElementById("submit");
submitBtn.disabled=true;
const r=await supabaseClient.auth.updateUser({password:p1});
submitBtn.disabled=false;
if(r.error)return show(r.error.message,"err");
show(t.saved,"ok");
await supabaseClient.auth.signOut();
setTimeout(()=>{ location.href="login.html"; }, 2000);
};
</script></body></html>
