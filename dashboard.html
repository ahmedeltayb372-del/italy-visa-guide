<div id="siteUpdateBanner" style="display:none;position:fixed;inset:0;z-index:2147483647;background:linear-gradient(135deg,#0b1d3a,#16305e);color:#fff;text-align:center;flex-direction:column;align-items:center;justify-content:center;overflow:auto;padding:24px">

  <div style="font-size:46px;margin-bottom:10px">🧳</div>

  <div id="siteUpdateCountdownCaption" style="display:none;font-size:13px;opacity:.7;margin-bottom:10px;letter-spacing:1px"></div>
  <div id="siteUpdateCountdown" style="display:none;gap:14px;flex-wrap:wrap;justify-content:center"></div>
</div>
<script>
(async function(){
  var r = await supabaseClient.from("guide_settings").select("key,value_ar,value_en").in("key",["site_banner_enabled","site_banner_message","site_launch_date"]);
  if(r.error||!r.data) return;
  var by = {}; r.data.forEach(function(x){by[x.key]=x});
  var en = by.site_banner_enabled && (by.site_banner_enabled.value_ar==="true" || by.site_banner_enabled.value_en==="true");
  if(!en) return;
  var isEn = document.documentElement.lang==="en";
  var m = by.site_banner_message ? (isEn ? (by.site_banner_message.value_en||by.site_banner_message.value_ar) : (by.site_banner_message.value_ar||by.site_banner_message.value_en)) : (isEn?"We are rolling out some updates.":"الموقع في شوية تحديثات.");
  var d = by.site_launch_date ? (by.site_launch_date.value_ar||by.site_launch_date.value_en) : "";
  var el = document.getElementById("siteUpdateBanner");
  document.getElementById("siteUpdateBannerMsg").textContent = m;
  el.style.display = "flex";
  document.documentElement.style.overflow = "hidden";
  if(d){
    var target = new Date(d + "T00:00:00").getTime();
    if(!isNaN(target)){
      var cap = document.getElementById("siteUpdateCountdownCaption");
      var cd = document.getElementById("siteUpdateCountdown");
      cap.style.display = "block";
      cap.textContent = isEn ? "Opening in" : "الافتتاح خلال";
      cd.style.display = "flex";
      var labels = isEn ? ["Days","Hours","Min","Sec"] : ["يوم","ساعة","دقيقة","ثانية"];
      function pad(n){ return String(n).padStart(2,"0"); }
      var timer;
      function render(){
        var diff = target - Date.now();
        if(diff <= 0){
          cap.style.display = "none";
          cd.innerHTML = '<div style="font-size:20px;font-weight:800;color:#ffc857">' + (isEn ? "Launching soon! 🎉" : "قريباً جداً! 🎉") + '</div>';
          clearInterval(timer);
          return;
        }
        var dd = Math.floor(diff/86400000);
        var hh = Math.floor(diff%86400000/3600000);
        var mm = Math.floor(diff%3600000/60000);
        var ss = Math.floor(diff%60000/1000);
        var vals = [dd,hh,mm,ss];
        var html = "";
        for(var i=0;i<4;i++){
          html += '<div style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:14px 16px;min-width:70px">'
            + '<div style="font-size:30px;font-weight:800;color:#ffc857;font-variant-numeric:tabular-nums">' + pad(vals[i]) + '</div>'
            + '<div style="font-size:11px;opacity:.7;margin-top:4px">' + labels[i] + '</div></div>';
        }
        cd.innerHTML = html;
      }
      render();
      timer = setInterval(render, 1000);
    }
  }
})();
</script>

<script>

function tr(){const t=T[en?"en":"ar"];document.documentElement.lang=en?"en":"ar";document.documentElement.dir=en?"ltr":"rtl";["ey","welcome","sub","guideTitle","guideSub","logout","lang"].forEach(id=>{const map={ey:"ey",welcome:"welcome",sub:"sub",guideTitle:"guideTitle",guideSub:"guideSub",logout:"logout",lang:"switch"};document.getElementById(id).textContent=t[map[id]]});

const dashKeyMap={dash_switch:"switch",dash_ey:"ey",dash_welcome:"welcome",dash_sub:"sub",dash_guide_title:"guideTitle",dash_guide_sub:"guideSub",dash_logout:"logout"};
async function loadSiteText(){

  if(error||!data)return;
  data.forEach(row=>{const k=dashKeyMap[row.key];if(!k)return;if(row.value_ar)T.ar[k]=row.value_ar;if(row.value_en)T.en[k]=row.value_en;});

/* ---------- Theme ---------- */
function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  const btn = document.getElementById("themeBtn");
  if(btn) btn.textContent = t==="dark" ? "☀️" : "🌙";
}
let theme = localStorage.getItem("theme") || ((window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light");
applyTheme(theme);
document.getElementById("themeBtn").onclick=()=>{ theme = theme==="dark" ? "light" : "dark"; localStorage.setItem("theme", theme); applyTheme(theme); };

/* ---------- Toasts ---------- */
function toast(msg){
  const c = document.getElementById("toastContainer");
  if(!c) return;
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  c.appendChild(el);
  requestAnimationFrame(()=>el.classList.add("show"));
  setTimeout(()=>{ el.classList.remove("show"); setTimeout(()=>el.remove(), 300); }, 2600);
}

function lastKey(){ return "lastSection_"+currentUserId; }
function getReadSet(){ try{ return new Set(JSON.parse(localStorage.getItem(readKey())||"[]")); }catch(e){ return new Set(); } }
function saveReadSet(s){ localStorage.setItem(readKey(), JSON.stringify([...s])); }
function getFavSet(){ try{ return new Set(JSON.parse(localStorage.getItem(favKey())||"[]")); }catch(e){ return new Set(); } }
function saveFavSet(s){ localStorage.setItem(favKey(), JSON.stringify([...s])); }
function toggleFav(id){ const s=getFavSet(); if(s.has(id)) s.delete(id); else s.add(id); saveFavSet(s); }
function getLast(){ try{ return JSON.parse(localStorage.getItem(lastKey())||"null"); }catch(e){ return null; } }
function saveLast(o){ localStorage.setItem(lastKey(), JSON.stringify(o)); }

/* ---------- Guide sections ---------- */
let guideSectionsCache = [];

function estimateReadTime(html){
  const text = (html||"").replace(/<[^>]*>/g," ");
  const words = text.trim().split(/\s+/).filter(Boolean).length;
  return Math.max(1, Math.round(words/180));
}

function updateProgress(){
  const wrap = document.getElementById("progressWrap");
  const total = guideSectionsCache.length;
  if(!total){ wrap.style.display="none"; return; }
  const readSet = getReadSet();
  const readCount = guideSectionsCache.filter(s=>readSet.has(String(s.section_key||s.id))).length;
  const pct = Math.round(readCount/total*100);
  wrap.style.display = "block";
  document.getElementById("progressLabel").textContent = en ? "Reading progress" : "تقدمك في القراءة";
  document.getElementById("progressPct").textContent = readCount+" / "+total+" ("+pct+"%)";
  document.getElementById("progressFill").style.width = pct+"%";
}

function updateContinueCard(){
  const box = document.getElementById("continueCard");
  const last = getLast();
  if(!last || !guideSectionsCache.some(s=>String(s.section_key||s.id)===String(last.catId))){ box.style.display="none"; return; }
  box.style.display = "flex";
  document.getElementById("continueEyebrow").textContent = en ? "Continue where you left off" : "أكمل من حيث توقفت";
  document.getElementById("continueTitle").textContent = last.title||"";
  const btn = document.getElementById("continueBtn");
  btn.textContent = en ? "Continue" : "متابعة";
  btn.onclick = ()=> showCategory(last.catId);
}

function renderGrid(){
  const wrap = document.getElementById("catGrid");
  if(!wrap) return;
  const q = (document.getElementById("sectionSearch").value||"").trim().toLowerCase();
  const favOnly = document.getElementById("favOnly").checked;
  const favSet = getFavSet(); const readSet = getReadSet();
  let list = guideSectionsCache;
  if(q) list = list.filter(s=> (s.title||"").toLowerCase().includes(q) || (s.description||"").toLowerCase().includes(q));
  if(favOnly) list = list.filter(s=> favSet.has(String(s.section_key||s.id)));
  if(!list.length){ wrap.innerHTML = '<div class="state-box">'+(en?"No matching sections.":"لا يوجد نتائج مطابقة.")+'</div>'; return; }
  let html = "";
  list.forEach(section=>{
    const catId = String(section.section_key || section.id);
    const isFav = favSet.has(catId);
    const isRead = readSet.has(catId);
    html += `<div class="cat-card-wrap"><button type="button" class="cat-card" data-cat-id="${catId}">${isRead?'<span class="read-badge" title="'+(en?"Read":"تمت القراءة")+'">✓</span>':""}<div class="stamp">${section.icon || "📄"}</div><h3>${section.title || ""}</h3></button><button type="button" class="star-btn${isFav?" active":""}" data-star-id="${catId}" aria-label="${en?"Bookmark":"مفضلة"}">${isFav?"★":"☆"}</button></div>`;
  });
  wrap.innerHTML = html;
}

async function loadGuideSections(){
  const wrap = document.getElementById("dynamicSections");
  const { data, error } = await supabaseClient.from("guide_sections").select("*").eq("visible", true).order("order_index", { ascending: true });
  if (error){ wrap.innerHTML = '<div class="lockbox">🔒<p>'+(en?"You don't have access to view this content.":"مفيش صلاحية لعرض المحتوى ده حالياً.")+'</p></div>'; document.getElementById("progressWrap").style.display="none"; document.getElementById("continueCard").style.display="none"; return; }
  if (!data || !data.length){ wrap.innerHTML = '<div class="state-box">'+(en?"No guide content yet.":"لا يوجد محتوى مضاف حتى الآن.")+'</div>'; document.getElementById("progressWrap").style.display="none"; document.getElementById("continueCard").style.display="none"; return; }
  guideSectionsCache = data;
  wrap.innerHTML = `<div id="catGrid" class="cat-grid"></div><div id="catDetail" class="cat-detail"></div>`;
  document.getElementById("catGrid").addEventListener("click", e=>{
    const starBtn = e.target.closest(".star-btn");
    if(starBtn){
      const id = starBtn.dataset.starId;
      toggleFav(id);
      renderGrid();
      toast(getFavSet().has(id) ? (en?"Added to bookmarks ⭐":"أُضيف للمفضلة ⭐") : (en?"Removed from bookmarks":"اتشال من المفضلة"));
      return;
    }
    const btn = e.target.closest(".cat-card");
    if (!btn) return;
    showCategory(btn.dataset.catId);
  });
  renderGrid();
  updateProgress();
  updateContinueCard();

  const hash = decodeURIComponent(location.hash.replace("#",""));
  if(hash && guideSectionsCache.some(s=>String(s.section_key||s.id)===hash)){ showCategory(hash, {skipHash:true}); }
}

function showCategory(catId, opts){
  opts = opts || {};
  const section = guideSectionsCache.find(s => String(s.section_key || s.id) === String(catId));
  if (!section) return;
  const grid = document.getElementById("catGrid");
  const detail = document.getElementById("catDetail");
  const mins = estimateReadTime(section.body_html);
  const isFav = getFavSet().has(catId);
  detail.innerHTML = `<button type="button" class="cat-back" id="catBackBtn">${en ? "← Back to categories" : "→ رجوع لكل الأقسام"}</button><section class="category"><div class="cat-head"><span class="stamp">${section.icon || "📄"}</span><div style="flex:1;min-width:0"><h3>${section.title || ""}</h3><div class="cat-meta">⏱️ ${mins} ${en?"min read":"دقايق قراءة"} · <span id="catStarInline" class="inline-star" data-star-id="${catId}">${isFav?(en?"★ Bookmarked":"★ في المفضلة"):(en?"☆ Add to bookmarks":"☆ إضافة للمفضلة")}</span></div></div><button type="button" class="btn outline btn-share" id="shareBtn">🔗 ${en?"Copy link":"نسخ الرابط"}</button></div>${section.description ? `<p class="cat-desc">${section.description}</p>` : ""}<div class="body-content">${section.body_html || ""}</div></section>`;
  document.getElementById("catBackBtn").addEventListener("click", ()=>closeCategory());
  document.getElementById("shareBtn").addEventListener("click", ()=>{
    const url = location.origin+location.pathname+"#"+encodeURIComponent(catId);
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(()=>toast(en?"Link copied ✅":"تم نسخ الرابط ✅")).catch(()=>toast(url));
    } else { toast(url); }
  });
  document.getElementById("catStarInline").addEventListener("click", ()=>{
    toggleFav(catId);
    const f = getFavSet().has(catId);
    document.getElementById("catStarInline").textContent = f ? (en?"★ Bookmarked":"★ في المفضلة") : (en?"☆ Add to bookmarks":"☆ إضافة للمفضلة");
  });
  grid.style.display = "none";
  detail.classList.add("open");
  detail.scrollIntoView({ behavior: "smooth", block: "start" });

  if(!opts.skipTrack){
    const rs = getReadSet();
    if(!rs.has(catId)){ rs.add(catId); saveReadSet(rs); updateProgress(); }
    saveLast({catId: catId, title: section.title||"", ts: Date.now()});
    updateContinueCard();
  }
  if(!opts.skipHash){ history.pushState({catId:catId}, "", "#"+encodeURIComponent(catId)); }
}

function closeCategory(opts){
  opts = opts || {};
  const grid = document.getElementById("catGrid");
  const detail = document.getElementById("catDetail");
  detail.classList.remove("open");
  detail.innerHTML = "";
  grid.style.display = "";
  renderGrid();
  if(!opts.skipHash && location.hash){ history.pushState({}, "", location.pathname); }
}

window.addEventListener("popstate", ()=>{
  if(!guideSectionsCache.length) return;
  const hash = decodeURIComponent(location.hash.replace("#",""));
  if(hash && guideSectionsCache.some(s=>String(s.section_key||s.id)===hash)){ showCategory(hash, {skipHash:true, skipTrack:true}); }
  else { closeCategory({skipHash:true}); }
});

document.getElementById("sectionSearch").addEventListener("input", renderGrid);
document.getElementById("favOnly").addEventListener("change", renderGrid);

/* ---------- Dashboard announcement (admin-configurable) ---------- */
async function loadAnnouncement(){
  const {data,error} = await supabaseClient.from("guide_settings").select("key,value_ar,value_en").in("key",["dashboard_announcement_enabled","dashboard_announcement_message"]);
  if(error||!data) return;
  const by={}; data.forEach(r=>by[r.key]=r);
  const enabled = by.dashboard_announcement_enabled && (by.dashboard_announcement_enabled.value_ar==="true" || by.dashboard_announcement_enabled.value_en==="true");
  if(!enabled) return;
  const msg = by.dashboard_announcement_message ? (en ? (by.dashboard_announcement_message.value_en||by.dashboard_announcement_message.value_ar) : (by.dashboard_announcement_message.value_ar||by.dashboard_announcement_message.value_en)) : "";
  if(!msg) return;
  let dismissKey = "announceDismissed_default";
  try{ dismissKey = "announceDismissed_" + btoa(unescape(encodeURIComponent(msg))).slice(0,24); }catch(e){}
  if(localStorage.getItem(dismissKey)) return;
  document.getElementById("dashAnnouncementText").textContent = msg;
  const box = document.getElementById("dashAnnouncement");
  box.style.display = "flex";
  document.getElementById("dashAnnouncementClose").onclick = ()=>{ localStorage.setItem(dismissKey,"1"); box.style.display="none"; };
}

/* ---------- Floating help widget ---------- */
async function loadHelpWidget(){
  const {data,error} = await supabaseClient.from("guide_settings").select("key,value_ar,value_en").in("key",["contact_whatsapp","contact_email","contact_instagram","contact_facebook"]);
  if(error||!data) return;
  const by={}; data.forEach(r=>by[r.key]=r);
  const items = [];
  const wa = by.contact_whatsapp && (by.contact_whatsapp.value_ar||by.contact_whatsapp.value_en);
  const em = by.contact_email && (by.contact_email.value_ar||by.contact_email.value_en);
  const ig = by.contact_instagram && (by.contact_instagram.value_ar||by.contact_instagram.value_en);
  const fb = by.contact_facebook && (by.contact_facebook.value_ar||by.contact_facebook.value_en);
  if(wa) items.push({icon:"💬", label: en?"WhatsApp":"واتساب", href: /^https?:/.test(wa) ? wa : ("https://wa.me/"+wa.replace(/[^\d]/g,""))});
  if(em) items.push({icon:"✉️", label: en?"Email":"إيميل", href: "mailto:"+em});
  if(ig) items.push({icon:"📷", label:"Instagram", href: /^https?:/.test(ig) ? ig : ("https://instagram.com/"+ig.replace("@",""))});
  if(fb) items.push({icon:"📘", label:"Facebook", href: /^https?:/.test(fb) ? fb : ("https://facebook.com/"+fb)});
  if(!items.length) return;
  document.getElementById("helpLinks").innerHTML = items.map(it=>`<a class="help-link" href="${it.href}" target="_blank" rel="noopener">${it.icon} ${it.label}</a>`).join("");
  document.getElementById("helpPanelTitle").textContent = en ? "Need help?" : "تحتاج مساعدة؟";
  document.getElementById("helpWidget").style.display = "block";
  document.getElementById("helpToggleBtn").onclick = ()=>{ document.getElementById("helpPanel").classList.toggle("open"); };
}

  if(profile&&profile.banned){await supabaseClient.auth.signOut();alert(T[en?"en":"ar"].banned);location.href="login.html";return;}
  const meta=r.data.user.user_metadata||{}; const first=((profile&&profile.first_name)||meta.first_name||"").trim(); const last=((profile&&profile.last_name)||meta.last_name||"").trim(); const fullName=(first+" "+last).trim(); const rawEmail=r.data.user.email||""; const displayNameRaw=fullName||rawEmail.split("@")[0]||(en?"there":"صديقنا"); const displayName=displayNameRaw.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); const isAdmin=!!(profile&&profile.role==="admin"); const adminBadge=isAdmin?(' <span style="background:#eef2ff;color:#3730a3;padding:3px 10px;border-radius:20px;font-size:13px;font-weight:800;display:inline-flex;align-items:center;gap:4px;vertical-align:middle">🛡️ '+(en?"Admin":"أدمن")+'</span>'):""; document.getElementById("welcome").innerHTML=(en?"Welcome, ":"مرحبًا، ")+'<span style="font-size:16px;font-weight:600;overflow-wrap:break-word;word-break:normal;display:inline-block;max-width:100%;vertical-align:bottom">'+displayName+'</span>'+" 👋"+adminBadge;

document.getElementById("logout").onclick=async()=>{await supabaseClient.auth.signOut();location.href="index.html"};
