let guideSectionsCache = []; async function loadGuideSections(){ const wrap = document.getElementById("dynamicSections"); const { data, error } = await supabaseClient.from("guide_sections").select("*").eq("visible", true).order("order_index", { ascending: true }); if (error){ wrap.innerHTML = '<div class="lockbox">🔒<p>'+(en?"You don't have access to view this content.":"مفيش صلاحية لعرض المحتوى ده حالياً.")+'</p></div>'; return; } if (!data || !data.length){ wrap.innerHTML = '<div class="state-box">'+(en?"No guide content yet.":"لا يوجد محتوى مضاف حتى الآن.")+'</div>'; return; } guideSectionsCache = data; let cardsHtml = ""; data.forEach(section=>{ const catId = section.section_key || section.id; cardsHtml += `<button type="button" class="cat-card" data-cat-id="${catId}"><div class="stamp">${section.icon || "📄"}</div><h3>${section.title || ""}</h3></button>`; }); wrap.innerHTML = `<div id="catGrid" class="cat-grid">${cardsHtml}</div><div id="catDetail" class="cat-detail"></div>`; document.getElementById("catGrid").addEventListener("click", e=>{ const btn = e.target.closest(".cat-card"); if (!btn) return; showCategory(btn.dataset.catId); }); } function showCategory(catId){ const section = guideSectionsCache.find(s => String(s.section_key || s.id) === String(catId)); if (!section) return; const grid = document.getElementById("catGrid"); const detail = document.getElementById("catDetail"); detail.innerHTML = `<button type="button" class="cat-back" id="catBackBtn">${en ? "← Back to categories" : "→ رجوع لكل الأقسام"}</button><section class="category"><div class="cat-head"><span class="stamp">${section.icon || "📄"}</span><h3>${section.title || ""}</h3></div>${section.description ? `<p class="cat-desc">${section.description}</p>` : ""}<div class="body-content">${section.body_html || ""}</div></section>`; document.getElementById("catBackBtn").addEventListener("click", closeCategory); grid.style.display = "none"; detail.classList.add("open"); detail.scrollIntoView({ behavior: "smooth", block: "start" }); } function closeCategory(){ const grid = document.getElementById("catGrid"); const detail = document.getElementById("catDetail"); detail.classList.remove("open"); detail.innerHTML = ""; grid.style.display = ""; }
