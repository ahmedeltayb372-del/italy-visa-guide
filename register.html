<body>
<div id="siteUpdateBanner" style="display:none;position:fixed;inset:0;z-index:2147483647;background:linear-gradient(135deg,#0b1d3a,#16305e);color:#fff;text-align:center;flex-direction:column;align-items:center;justify-content:center;overflow:auto;padding:24px">
  <div style="font-size:14px;letter-spacing:3px;opacity:.65;margin-bottom:14px">🇮🇹 ITALY VISA GUIDE</div>
  <div style="font-size:46px;margin-bottom:10px">🧳</div>
  <div id="siteUpdateBannerMsg" style="font-weight:700;font-size:21px;line-height:1.9;max-width:620px;margin-bottom:18px"></div>
  <div id="siteUpdateCountdownCaption" style="display:none;font-size:13px;opacity:.7;margin-bottom:10px;letter-spacing:1px"></div>
  <div id="siteUpdateCountdown" style="display:none;gap:14px;flex-wrap:wrap;justify-content:center"></div>
</div>
<script>
(async function(){
  var r = await supabaseClient.from("guide_settings").select("key,value_ar,value_en").in("key",["site_banner_enabled","site_banner_message","site_launch_date"]);
  if(r.error||!r.data) return;
  var by = {}; r.data.forEach(function(x){by[x.key]=x});
  var en = by.site_banner_enabled && (by.site_banner_enabled.value_ar==="true" || by.site_banner_enabled.value_en==="true");
  if(!en) return;
  var isEn = document.documentElement.lang==="en";
  var m = by.site_banner_message ? (isEn ? (by.site_banner_message.value_en||by.site_banner_message.value_ar) : (by.site_banner_message.value_ar||by.site_banner_message.value_en)) : (isEn?"We are rolling out some updates.":"الموقع في شوية تحديثات.");
  var d = by.site_launch_date ? (by.site_launch_date.value_ar||by.site_launch_date.value_en) : "";
  var el = document.getElementById("siteUpdateBanner");
  document.getElementById("siteUpdateBannerMsg").textContent = m;
  el.style.display = "flex";
  document.documentElement.style.overflow = "hidden";
  if(d){
    var target = new Date(d + "T00:00:00").getTime();
    if(!isNaN(target)){
      var cap = document.getElementById("siteUpdateCountdownCaption");
      var cd = document.getElementById("siteUpdateCountdown");
      cap.style.display = "block";
      cap.textContent = isEn ? "Opening in" : "الافتتاح خلال";
      cd.style.display = "flex";
      var labels = isEn ? ["Days","Hours","Min","Sec"] : ["يوم","ساعة","دقيقة","ثانية"];
      function pad(n){ return String(n).padStart(2,"0"); }
      var timer;
      function render(){
        var diff = target - Date.now();
        if(diff <= 0){
          cap.style.display = "none";
          cd.innerHTML = '<div style="font-size:20px;font-weight:800;color:#ffc857">' + (isEn ? "Launching soon! 🎉" : "قريباً جداً! 🎉") + '</div>';
          clearInterval(timer);
          return;
        }
        var dd = Math.floor(diff/86400000);
        var hh = Math.floor(diff%86400000/3600000);
        var mm = Math.floor(diff%3600000/60000);
        var ss = Math.floor(diff%60000/1000);
        var vals = [dd,hh,mm,ss];
        var html = "";
        for(var i=0;i<4;i++){
          html += '<div style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:14px 16px;min-width:70px">'
            + '<div style="font-size:30px;font-weight:800;color:#ffc857;font-variant-numeric:tabular-nums">' + pad(vals[i]) + '</div>'
            + '<div style="font-size:11px;opacity:.7;margin-top:4px">' + labels[i] + '</div></div>';
        }
        cd.innerHTML = html;
      }
      render();
      timer = setInterval(render, 1000);
    }
  }
})();
</script>

<div class="card">

<h1 id="title">إنشاء حساب</h1>

<p class="sub" id="sub">
أنشئ حسابك مجاناً وابدأ متابعة رحلة التأشيرة.
</p>

<form id="registerForm">

<label id="emailLabel">البريد الإلكتروني</label>
<input
type="email"
id="email"
required
placeholder="example@email.com">

<label id="passLabel">كلمة المرور</label>
<input
type="password"
id="password"
required
minlength="6">

<label id="confirmLabel">تأكيد كلمة المرور</label>
<input
type="password"
id="confirm"
required
minlength="6">

<button type="submit" id="submitBtn">
إنشاء الحساب
</button>

</form>

<div id="errorBox" class="msg error"></div>
<div id="successBox" class="msg success"></div>

<div class="footer">
<span id="footerText">لديك حساب بالفعل؟</span>
<a href="login.html" id="footerLink">تسجيل الدخول</a>
</div>

</div>

<script>

const T = {
title:"إنشاء حساب",
sub:"أنشئ حسابك مجاناً وابدأ متابعة رحلة التأشيرة.",
email:"البريد الإلكتروني",
pass:"كلمة المرور",
confirm:"تأكيد كلمة المرور",
submit:"إنشاء الحساب",
footerText:"لديك حساب بالفعل؟",
footerLink:"تسجيل الدخول",
errMismatch:"كلمتا المرور غير متطابقتين",
errShort:"كلمة المرور يجب أن تكون 6 أحرف على الأقل",
success:"تم إنشاء الحساب بنجاح"
};

function applyText(){
document.getElementById("pageTitle").textContent = T.title;
document.getElementById("title").textContent = T.title;
document.getElementById("sub").textContent = T.sub;
document.getElementById("emailLabel").textContent = T.email;
document.getElementById("passLabel").textContent = T.pass;
document.getElementById("confirmLabel").textContent = T.confirm;
document.getElementById("submitBtn").textContent = T.submit;
document.getElementById("footerText").textContent = T.footerText;
document.getElementById("footerLink").textContent = T.footerLink;
}
applyText();

const registerKeyMap = {
register_title:"title",
register_sub:"sub",
register_email_label:"email",
register_pass_label:"pass",
register_confirm_label:"confirm",
register_submit:"submit",
register_footer_text:"footerText",
register_footer_link:"footerLink",
register_err_mismatch:"errMismatch",
register_err_short:"errShort",
register_success:"success"
};

async function loadSiteText(){
  const {data,error} = await supabaseClient.from("guide_settings").select("key,value_ar,value_en").eq("page_group","register");
  if(error || !data) return;
  data.forEach(row=>{
    const k = registerKeyMap[row.key];
    if(!k) return;
    if(row.value_ar) T[k] = row.value_ar;
  });
  applyText();
}
loadSiteText();

function showError(message){
const box = document.getElementById("errorBox");
box.style.display = "block";
box.textContent = message;

document.getElementById("successBox").style.display = "none";
}

function showSuccess(message){
const box = document.getElementById("successBox");
box.style.display = "block";
box.textContent = message;

document.getElementById("errorBox").style.display = "none";
}

document
.getElementById("registerForm")
.addEventListener("submit", async function(e){

e.preventDefault();

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const confirm =
document.getElementById("confirm").value;

if(password !== confirm){
showError(T.errMismatch);
return;
}

if(password.length < 6){
showError(T.errShort);
return;
}

const { data, error } =
await supabaseClient.auth.signUp({
email: email,
password: password
});

if(error){
showError(error.message);
return;
}

showSuccess(T.success);

setTimeout(() => {
window.location.href = "login.html";
},1500);

});
</script>
