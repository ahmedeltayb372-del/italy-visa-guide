<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title id="pageTitle">إنشاء حساب</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://sderoafpcfgabdkqvbyc.supabase.co";
const SUPABASE_KEY = "sb_publishable_UY5vKu9IGqYLSv_j3xp9fQ_qi-LKvb3";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
</script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
overflow-wrap:anywhere;
}

html,body{overflow-x:hidden;max-width:100%}

body{
background:#f4f6fb;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.card{
background:#fff;
width:100%;
max-width:500px;
padding:35px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

@media(max-width:420px){
.card{padding:22px}
}

h1{
text-align:center;
margin-bottom:10px;
color:#0b1730;
}

.sub{
text-align:center;
color:#666;
margin-bottom:25px;
}

label{
display:block;
margin-bottom:8px;
font-weight:bold;
}

input{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:10px;
margin-bottom:18px;
font-size:16px;
}

input:focus{
outline:none;
border-color:#2457ff;
}

button{
width:100%;
padding:14px;

}

.msg{

padding:12px;
border-radius:10px;

}

color:#c1121f;
}

.success{
background:#ecfdf3;
color:#027a48;
}

margin-top:20px;
}

.footer a{

text-decoration:none;

</style>
</head>
<body>

<div id="siteUpdateBanner" style="display:none;background:#fff3cd;border-bottom:1px solid #ffe1a8;color:#7a5b00;text-align:center;padding:10px 16px;font-weight:700;font-size:14px;line-height:1.6"></div>
<script>
(async function(){
  var r = await supabaseClient.from("guide_settings").select("key,value_ar,value_en").in("key",["site_banner_enabled","site_banner_message","site_launch_date"]);
  if(r.error||!r.data) return;
  var by={}; r.data.forEach(function(x){by[x.key]=x});
  var en = by.site_banner_enabled && (by.site_banner_enabled.value_ar==="true" || by.site_banner_enabled.value_en==="true");
  if(!en) return;
  var isEn = document.documentElement.lang==="en";
  var m = by.site_banner_message ? (isEn ? (by.site_banner_message.value_en||by.site_banner_message.value_ar) : (by.site_banner_message.value_ar||by.site_banner_message.value_en)) : (isEn?"We are rolling out some updates.":"الموقع في شوية تحديثات.");
  var d = by.site_launch_date ? (by.site_launch_date.value_ar||by.site_launch_date.value_en) : "";
  if(d) m += isEn ? (" Expected launch: "+d) : (" — الافتتاح المتوقع: "+d);
  var el = document.getElementById("siteUpdateBanner");
  el.textContent = "🚧 " + m;
  el.style.display = "block";
})();
</script>

<div class="card">

<h1 id="title">إنشاء حساب</h1>

<p class="sub" id="sub">
أنشئ حسابك مجاناً وابدأ متابعة رحلة التأشيرة.
</p>

<form id="registerForm">

<label id="emailLabel">البريد الإلكتروني</label>
<input
type="email"
id="email"
required
placeholder="example@email.com">

<label id="passLabel">كلمة المرور</label>
<input
type="password"
id="password"
required
minlength="6">

<label id="confirmLabel">تأكيد كلمة المرور</label>
<input
type="password"
id="confirm"
required
minlength="6">

<button type="submit" id="submitBtn">
إنشاء الحساب
</button>

</form>

<div id="errorBox" class="msg error"></div>
<div id="successBox" class="msg success"></div>

<div class="footer">
<span id="footerText">لديك حساب بالفعل؟</span>
<a href="login.html" id="footerLink">تسجيل الدخول</a>
</div>

</div>

<script>

const T = {
title:"إنشاء حساب",
sub:"أنشئ حسابك مجاناً وابدأ متابعة رحلة التأشيرة.",
email:"البريد الإلكتروني",
pass:"كلمة المرور",
confirm:"تأكيد كلمة المرور",
submit:"إنشاء الحساب",
footerText:"لديك حساب بالفعل؟",
footerLink:"تسجيل الدخول",
errMismatch:"كلمتا المرور غير متطابقتين",
errShort:"كلمة المرور يجب أن تكون 6 أحرف على الأقل",
success:"تم إنشاء الحساب بنجاح"
};

function applyText(){
document.getElementById("pageTitle").textContent = T.title;
document.getElementById("title").textContent = T.title;
document.getElementById("sub").textContent = T.sub;
document.getElementById("emailLabel").textContent = T.email;
document.getElementById("passLabel").textContent = T.pass;
document.getElementById("confirmLabel").textContent = T.confirm;
document.getElementById("submitBtn").textContent = T.submit;
document.getElementById("footerText").textContent = T.footerText;
document.getElementById("footerLink").textContent = T.footerLink;
}
applyText();

const registerKeyMap = {
register_title:"title",
register_sub:"sub",
register_email_label:"email",
register_pass_label:"pass",
register_confirm_label:"confirm",
register_submit:"submit",
register_footer_text:"footerText",
register_footer_link:"footerLink",
register_err_mismatch:"errMismatch",
register_err_short:"errShort",
register_success:"success"
};

async function loadSiteText(){
  const {data,error} = await supabaseClient.from("guide_settings").select("key,value_ar,value_en").eq("page_group","register");
  if(error || !data) return;
  data.forEach(row=>{
    const k = registerKeyMap[row.key];
    if(!k) return;
    if(row.value_ar) T[k] = row.value_ar;
  });
  applyText();
}
loadSiteText();

function showError(message){
const box = document.getElementById("errorBox");
box.style.display = "block";
box.textContent = message;

document.getElementById("successBox").style.display = "none";
}

function showSuccess(message){
const box = document.getElementById("successBox");
box.style.display = "block";
box.textContent = message;

document.getElementById("errorBox").style.display = "none";
}

document
.getElementById("registerForm")
.addEventListener("submit", async function(e){

e.preventDefault();

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const confirm =
document.getElementById("confirm").value;

if(password !== confirm){
showError(T.errMismatch);
return;
}

if(password.length < 6){
showError(T.errShort);
return;
}

const { data, error } =
await supabaseClient.auth.signUp({
email: email,
password: password
});

if(error){
showError(error.message);
return;
}

showSuccess(T.success);

setTimeout(() => {
window.location.href = "login.html";
},1500);

});
</script>

</body>
</html>
