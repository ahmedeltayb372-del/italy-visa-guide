<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إنشاء حساب</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
<script>
const SUPABASE_URL = "https://sderoafpcfgabdkqvbyc.supabase.co";
const SUPABASE_KEY = "sb_publishable_UY5vKu9IGqYLSv_j3xp9fQ_qi-LKvb3";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
</script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
background:#f4f6fb;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.card{
background:#fff;
width:100%;
max-width:500px;
padding:35px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

h1{
text-align:center;
margin-bottom:10px;
color:#0b1730;
}

.sub{
text-align:center;
color:#666;
margin-bottom:25px;
}

label{
display:block;
margin-bottom:8px;
font-weight:bold;
}

input{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:10px;
margin-bottom:18px;
font-size:16px;
}

input:focus{
outline:none;
border-color:#2457ff;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#2457ff;
color:#fff;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.msg{
display:none;
padding:12px;
border-radius:10px;
margin-top:15px;
text-align:center;
}

.error{
background:#fff0f0;
color:#c1121f;
}

.success{
background:#ecfdf3;
color:#027a48;
}

.footer{
text-align:center;
margin-top:20px;
}

.footer a{
color:#2457ff;
text-decoration:none;
font-weight:bold;
}
</style>
</head>
<body>

<div class="card">

<h1>إنشاء حساب</h1>

<p class="sub">
أنشئ حسابك مجاناً وابدأ متابعة رحلة التأشيرة.
</p>

<form id="registerForm">

<label>البريد الإلكتروني</label>
<input
type="email"
id="email"
required
placeholder="example@email.com">

<label>كلمة المرور</label>
<input
type="password"
id="password"
required
minlength="6">

<label>تأكيد كلمة المرور</label>
<input
type="password"
id="confirm"
required
minlength="6">

<button type="submit">
إنشاء الحساب
</button>

</form>

<div id="errorBox" class="msg error"></div>
<div id="successBox" class="msg success"></div>

<div class="footer">
لديك حساب بالفعل؟
<a href="login.html">تسجيل الدخول</a>
</div>

</div>

<script>

function showError(message){
const box = document.getElementById("errorBox");
box.style.display = "block";
box.textContent = message;

document.getElementById("successBox").style.display = "none";
}

function showSuccess(message){
const box = document.getElementById("successBox");
box.style.display = "block";
box.textContent = message;

document.getElementById("errorBox").style.display = "none";
}

document
.getElementById("registerForm")
.addEventListener("submit", async function(e){

e.preventDefault();

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const confirm =
document.getElementById("confirm").value;

if(password !== confirm){
showError("كلمتا المرور غير متطابقتين");
return;
}

if(password.length < 6){
showError("كلمة المرور يجب أن تكون 6 أحرف على الأقل");
return;
}

const { data, error } =
await supabaseClient.auth.signUp({
email: email,
password: password
});

if(error){
showError(error.message);
return;
}

showSuccess("تم إنشاء الحساب بنجاح");

setTimeout(() => {
window.location.href = "login.html";
},1500);

});
</script>

</body>
</html>
