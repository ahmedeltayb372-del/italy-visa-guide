function setMsg(text, ok=false){
  const el=document.getElementById("loginMsg");
  el.textContent=text;
  el.className="small"+(ok?" status":"");
}

async function login(){
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("pass").value;
  if(!email || !password){ setMsg("اكتب البريد الإلكتروني وكلمة المرور."); return; }
  setMsg("جارٍ تسجيل الدخول...");
  const {error}=await client.auth.signInWithPassword({email,password});
  if(error){ setMsg("فشل تسجيل الدخول: "+error.message); return; }
  document.getElementById("login").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  await build();
}

async function resetPassword(){
  const email=document.getElementById("email").value.trim();
  if(!email){ setMsg("اكتب الإيميل أولًا ثم اضغط نسيت كلمة المرور."); return; }
  const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
  if(error) setMsg("لم يتم إرسال رسالة الاستعادة: "+error.message);
  else setMsg("تم إرسال رابط تغيير كلمة المرور إلى بريدك الإلكتروني.", true);
}

async function logout(){
  await client.auth.signOut();
  location.reload();
}

function showApp(){
  document.getElementById("login").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  build();
}

async function build(){
  const root=document.getElementById("fields"); root.innerHTML="";
  defs.forEach(d=>{
    const box=document.createElement("div"); box.className="card";
    box.innerHTML='<h2>'+escapeHtml(d.label)+'</h2><div class="editor '+(d.id.startsWith("step-body")?"body":"")+'" contenteditable="true" data-id="'+d.id+'"></div>';
    root.appendChild(box);
  });
  await load();
}

function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

async function load(){
  const {data,error}=await client.from('site_content').select('content').eq('id',CONTENT_ROW_ID).maybeSingle();
  if(error){ document.getElementById("status").textContent="خطأ في تحميل المحتوى: "+error.message; return; }
  let elements=data?.content?.elements || {};
  // If the database is empty, load the current live page as the initial values.
  if(Object.keys(elements).length===0){
    try{
      const res=await fetch('index.html',{cache:'no-store'});
      const html=await res.text();
      const doc=new DOMParser().parseFromString(html,'text/html');
      doc.querySelectorAll('[data-edit]').forEach(el=>{elements[el.getAttribute('data-edit')]=el.innerHTML;});
    }catch(e){}
  }
  defs.forEach(d=>{
    const el=document.querySelector('[data-id="'+CSS.escape(d.id)+'"]');
    if(el && elements[d.id]!=null) el.innerHTML=elements[d.id];
  });
}

async function saveAll(){
  const elements={};
  document.querySelectorAll('[data-id]').forEach(el=>elements[el.dataset.id]=el.innerHTML);
  const {data:{user}}=await client.auth.getUser();
  if(!user){ document.getElementById("status").textContent="انتهت جلسة الدخول. سجّل الدخول مرة أخرى."; return; }
  const {error}=await client.from('site_content').upsert({id:CONTENT_ROW_ID,content:{elements}},{onConflict:'id'});
  const status=document.getElementById("status");
  if(error) status.textContent="❌ لم يتم الحفظ: "+error.message;
  else { status.textContent="✅ تم حفظ التعديلات، وستظهر للزوار."; setTimeout(()=>status.textContent="",4000); }
}

async function resetAll(){
  if(confirm("هل تريد حذف المحتوى المحفوظ في قاعدة البيانات؟")){
    const {error}=await client.from('site_content').delete().eq('id',CONTENT_ROW_ID);
    if(error) document.getElementById("status").textContent="❌ "+error.message;
    else location.reload();
  }
}

(async()=>{
  const {data:{session}}=await client.auth.getSession();
  if(session) showApp();
})();
