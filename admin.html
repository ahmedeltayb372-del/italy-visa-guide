<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الإدارة</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f7fb;
}

header{
    background:#0b1730;
    color:white;
    padding:20px;
}

.container{
    width:95%;
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    border-radius:15px;
    padding:20px;
    margin-top:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:12px;
    border-bottom:1px solid #eee;
    text-align:right;
}

th{
    background:#f8f8f8;
}

button{
    border:none;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
    margin:2px;
}

.admin{
    background:#2457ff;
    color:white;
}

.user{
    background:#888;
    color:white;
}

.logout{
    background:#e53935;
    color:white;
}
</style>
</head>
<body>

<header>
    <h2>لوحة الإدارة</h2>
</header>

<div class="container">

<div class="card">
    <h3>المستخدمون</h3>

    <table>
        <thead>
            <tr>
                <th>البريد</th>
                <th>الصلاحية</th>
                <th>إجراء</th>
            </tr>
        </thead>
        <tbody id="usersTable"></tbody>
    </table>
</div>

<button class="logout" onclick="logout()">
تسجيل الخروج
</button>

</div>

<script>

const supabase = window.supabase.createClient(
  "https://sderoafpcfgabdkqvbyc.supabase.co",
  "sb_publishable_UY5vKu9IGqYLSv_j3xp9fQ_qi-LKvb3"
);

async function checkAdmin(){

    const { data:userData } =
        await supabase.auth.getUser();

    if(!userData.user){
        location.href="login.html";
        return;
    }

    const { data:profile } = await supabase
        .from("profiles")
        .select("*")
        .eq("id", userData.user.id)
        .single();

    if(!profile || profile.role !== "admin"){
        alert("غير مصرح لك");
        location.href="index.html";
        return;
    }

    loadUsers();
}

async function loadUsers(){

    const { data:users, error } = await supabase
        .from("profiles")
        .select("*")
        .order("email");

    if(error){
        console.log(error);
        return;
    }

    let html="";

    users.forEach(user=>{

        html += `
        <tr>
            <td>${user.email}</td>
            <td>${user.role}</td>
            <td>
                ${
                    user.role==="user"
                    ?
                    `<button class="admin"
                    onclick="makeAdmin('${user.id}')">
                    اجعله Admin
                    </button>`
                    :
                    `<button class="user"
                    onclick="makeUser('${user.id}')">
                    اجعله User
                    </button>`
                }
            </td>
        </tr>
        `;
    });

    document.getElementById("usersTable").innerHTML = html;
}

async function makeAdmin(id){

    await supabase
    .from("profiles")
    .update({role:"admin"})
    .eq("id",id);

    loadUsers();
}

async function makeUser(id){

    await supabase
    .from("profiles")
    .update({role:"user"})
    .eq("id",id);

    loadUsers();
}

async function logout(){

    await supabase.auth.signOut();

    location.href="login.html";
}

checkAdmin();

</script>

</body>
</html>
