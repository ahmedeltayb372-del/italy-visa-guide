<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الإدارة</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#f4f6fb;
}

header{
background:#071a45;
color:#fff;
padding:25px;
}

.container{
width:95%;
max-width:1300px;
margin:30px auto;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-bottom:20px;
}

.stat{
background:#fff;
padding:20px;
border-radius:15px;
box-shadow:0 4px 20px rgba(0,0,0,.08);
}

.card{
background:#fff;
padding:20px;
border-radius:15px;
box-shadow:0 4px 20px rgba(0,0,0,.08);
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
padding:14px;
border-bottom:1px solid #eee;
text-align:right;
}

th{
background:#f5f7fb;
}

button{
border:none;
padding:10px 15px;
border-radius:8px;
cursor:pointer;
}

.btn-admin{
background:#2457ff;
color:white;
}

.btn-user{
background:#666;
color:white;
}

.btn-logout{
background:#e53935;
color:white;
margin-top:20px;
}

.loading{
text-align:center;
padding:20px;
}

select{
padding:8px;
border:1px solid #ddd;
border-radius:6px;
}
</style>

</head>
<body>

<header>
<h1>لوحة الإدارة</h1>
</header>

<div class="container">

<div class="stats">

<div class="stat">
<h3>عدد المستخدمين</h3>
<h2 id="usersCount">0</h2>
</div>

<div class="stat">
<h3>عدد الأدمن</h3>
<h2 id="adminsCount">0</h2>
</div>

</div>

<div class="card">

<h2>المستخدمون</h2>

<div id="loading" class="loading">
جاري التحميل...
</div>

<table>

<thead>
<tr>
<th>البريد</th>
<th>الصلاحية</th>
<th>الإجراء</th>
</tr>
</thead>

<tbody id="usersTable"></tbody>

</table>

</div>

<div class="card">

<h2>طلبات الفيزا</h2>

<table>

<thead>
<tr>
<th>الاسم</th>
<th>البريد</th>
<th>رقم الجواز</th>
<th>الدولة</th>
<th>الحالة</th>
<th>التاريخ</th>
</tr>
</thead>

<tbody id="requestsTable"></tbody>

</table>

</div>

<button class="btn-logout" onclick="logout()">
تسجيل الخروج
</button>

</div>

<script>

const supabaseClient = supabase.createClient(
"https://sderoafpcfgabdkqvbyc.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkZXJvYWZwY2ZnYWJka3F2YnljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3ODE0NDIsImV4cCI6MjEwMjM1NzQ0Mn0.OON8o3-Rr4VRgrECJyf-bDO5vRGU8G3NmM6PYYKipns"
);

async function checkAdmin(){

const {
data:{session}
} = await supabaseClient.auth.getSession();

if(!session){
location.href="login.html";
return;
}

const userEmail = session.user.email;

const {data:profile,error} = await supabaseClient
.from("profiles")
.select("*")
.eq("email",userEmail)
.single();

if(error){
alert(error.message);
return;
}

if(profile.role !== "admin"){
alert("غير مصرح بالدخول");
location.href="index.html";
return;
}

loadUsers();
}

async function loadUsers(){

document.getElementById("loading").style.display="block";

const {data:users,error} = await supabaseClient
.from("profiles")
.select("*")
.order("email");

document.getElementById("loading").style.display="none";

if(error){
alert(error.message);
return;
}

document.getElementById("usersCount").textContent =
users.length;

document.getElementById("adminsCount").textContent =
users.filter(x=>x.role==="admin").length;

let html="";

users.forEach(user=>{

html += `
<tr>
<td>${user.email}</td>
<td>${user.role}</td>
<td>

${
user.email==="ahmedeltayb372@gmail.com"
?
`<span style="color:#2457ff;font-weight:bold">
الأدمن الرئيسي
</span>`
:
user.role==="admin"
?
`<button class="btn-user"
onclick="makeUser('${user.id}')">
جعله User
</button>`
:
`<button class="btn-admin"
onclick="makeAdmin('${user.id}')">
جعله Admin
</button>`
}

</td>
</tr>
`;

});

document.getElementById("usersTable").innerHTML = html;

loadVisaRequests();
}

async function loadVisaRequests(){

const {data,error} = await supabaseClient
.from("visa_requests")
.select("*")
.order("created_at",{ascending:false});

if(error){
console.log(error);
return;
}

let html="";

data.forEach(row=>{

html += `
<tr>

<td>${row.full_name || "-"}</td>

<td>${row.user_email || "-"}</td>

<td>${row.passport_number || "-"}</td>

<td>${row.country || "-"}</td>

<td>
<select onchange="changeStatus('${row.id}',this.value)">
<option value="pending" ${row.status==="pending"?"selected":""}>
قيد المراجعة
</option>

<option value="approved" ${row.status==="approved"?"selected":""}>
مقبول
</option>

<option value="rejected" ${row.status==="rejected"?"selected":""}>
مرفوض
</option>

</select>
</td>

<td>
${new Date(row.created_at).toLocaleDateString()}
</td>

</tr>
`;

});

document.getElementById("requestsTable").innerHTML = html;
}

async function changeStatus(id,status){

const {error} = await supabaseClient
.from("visa_requests")
.update({status})
.eq("id",id);

if(error){
alert(error.message);
}

}

async function makeAdmin(id){

const {error} = await supabaseClient
.from("profiles")
.update({role:"admin"})
.eq("id",id);

if(error){
alert(error.message);
return;
}

loadUsers();
}

async function makeUser(id){

const {error} = await supabaseClient
.from("profiles")
.update({role:"user"})
.eq("id",id);

if(error){
alert(error.message);
return;
}

loadUsers();
}

async function logout(){

await supabaseClient.auth.signOut();
location.href="login.html";

}

checkAdmin();

</script>

</body>
</html>
